services:
  front:
    image: juaneliezer13/baifa-ui:release-1.0.4
    container_name: baifa-ui
    restart: unless-stopped
    ports:
      - "12001:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - NUXT_PUBLIC_API_BASE=${NUXT_PUBLIC_API_BASE:-http://baifa-api.batdev.lat:11001/api}
