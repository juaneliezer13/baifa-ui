services:
  front:
    image: juaneliezer13/baifa-ui:release-1.0.8
    container_name: baifa-ui
    restart: unless-stopped
    ports:
      - "${FRONT_PORT:-15001}:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - NUXT_PUBLIC_API_BASE=${NUXT_PUBLIC_API_BASE:-https://baifa-api.batdev.lat/api}
